server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router owns the URLs. nginx has no file at /boards/3, so without
    # this a page refresh there would 404 — try_files falls back to index.html
    # and lets the SPA read the path itself.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # hashed asset filenames never change contents, so cache them hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
