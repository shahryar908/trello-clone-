[project]
name = "trello-clone-backend"
version = "0.1.0"
description = "Trello clone backend — FastAPI + SQLModel + SQLite + JWT + WebSockets"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "pyjwt",
    "passlib[bcrypt]",
    "bcrypt==4.0.1",
    "python-dotenv",
]

[tool.uv]
package = false
