# WARNING: a plain Secret is only base64-encoded, NOT encrypted. Anyone who can
# read this file (or the git repo) can read the key. This file is committed here
# with a PLACEHOLDER value only — see the note at the bottom before you deploy.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: tack
type: Opaque
stringData: # stringData takes plain text; k8s base64-encodes it for you
  SECRET_KEY: "replace-me-before-deploying"
# Create the real one from the command line instead of committing it:
#
#   kubectl create secret generic backend-secret -n tack \
#     --from-literal=SECRET_KEY=<the 64-hex key from backend/.env>
#
# In stage 6 (ArgoCD) this gets replaced by a SealedSecret, which IS safe to
# commit because only the cluster holds the key that can decrypt it.
