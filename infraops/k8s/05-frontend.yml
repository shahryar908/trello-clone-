apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tack
spec:
  replicas: 1 # stateless, so this one CAN scale up freely
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: shahryar371/trello-frontend:latest
          imagePullPolicy: Always
          # nginx-unprivileged serves on 8080, not 80 — only root may bind
          # ports below 1024, and this container deliberately isn't root.
          ports:
            - containerPort: 8080
          # No env here on purpose: the API URL was baked in at `bun run build`
          # time (see src/api.js). Changing it means rebuilding the image.
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tack
spec:
  selector:
    app: frontend
  ports:
    - port: 80 # what other things in the cluster call
      targetPort: 8080 # what the container actually listens on
