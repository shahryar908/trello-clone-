# Cluster definition for local development.
#
# NOTE: this lives OUTSIDE infraops/k8s/ on purpose. That folder is what ArgoCD
# syncs into the cluster, and this is a kind config — not a Kubernetes resource.
# ArgoCD would fail trying to apply it.
#
# A kind cluster is a Docker container pretending to be a node, so nothing
# inside it is reachable from Windows by default. extraPortMappings punches
# ports 80/443 through, which is what lets the Ingress answer.
#
#   kind create cluster --name tack --config infraops/kind/kind-cluster.yml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tack
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
