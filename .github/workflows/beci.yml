name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/beci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/beci.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: shahryar371/trello-backend

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      # Add lint/test steps here once ruff/pytest are set up
      # - name: Lint
      #   run: uv run ruff check .
      # - name: Test
      #   run: uv run pytest

      - name: Smoke check (app imports)
        run: uv run python -c "import app.main"

  publish:
    name: Publish image
    runs-on: ubuntu-latest
    needs: build
    # never publish from a pull request — only merged code reaches the registry
    if: github.event_name != 'pull_request'
    permissions:
      contents: write # needed to commit the tag bump back to main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/dockerfile
          push: true
          # the SHA tag is the one that matters: it is immutable, and changing
          # it in the manifest is what tells ArgoCD to deploy
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point the manifest at the new image
        run: |
          sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${GITHUB_SHA}|" \
            infraops/k8s/04-backend.yml
          git diff --exit-code && echo "no change" && exit 0

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(backend): ${GITHUB_SHA} [skip ci]"

          # the frontend workflow may have pushed while we were building
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
