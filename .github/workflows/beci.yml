name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/beci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/beci.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: shahryar371/trello-backend

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      # --locked fails the build if uv.lock is out of date with pyproject.toml,
      # so CI can never quietly install different versions than you did
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      # This is the gate. Everything below — the image, the manifest bump, the
      # ArgoCD sync — only happens because this step exited 0.
      - name: Test
        run: uv run pytest -q

  publish:
    name: Publish image
    runs-on: ubuntu-latest
    needs: build
    # never publish from a pull request — only merged code reaches the registry
    if: github.event_name != 'pull_request'
    permissions:
      contents: write # needed to commit the tag bump back to main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # the default runner uses the plain "docker" driver, which cannot export
      # a build cache — buildx's docker-container driver can
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/dockerfile
          push: true
          # the SHA tag is the one that matters: it is immutable, and changing
          # it in the manifest is what tells ArgoCD to deploy
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point the manifest at the new image
        run: |
          sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${GITHUB_SHA}|" \
            infraops/k8s/04-backend.yml
          git diff --exit-code && echo "no change" && exit 0

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(backend): ${GITHUB_SHA} [skip ci]"

          # the frontend workflow may have pushed while we were building
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
